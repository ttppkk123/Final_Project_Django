{% load static %}

<!-- Footer Start -->
<div class="container-fluid bg-dark text-light footer pt-5 mt-5">

    <div class="container py-5">
        <div class="row g-5">

            <div class="col-lg-3 col-md-6">
                <h4 class="section-title ff-secondary text-start text-primary fw-normal mb-4">
                    AMBAVI

                <a class="btn btn-link" href="{% url 'restaurant:about' %}">
                    About Us
                </a>

                <a class="btn btn-link" href="{% url 'restaurant:menu' %}">

                </a>

                        <a href="{% url 'restaurant:contact' %}">Contact</a>

        </div>
