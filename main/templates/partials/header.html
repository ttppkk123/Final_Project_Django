{% load static %}   
<!-- Spinner Start -->
<div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="sr-only">Loading...</span>
    </div>
</div>
<!-- Spinner End -->


<!-- Navbar Start -->
<div class="container-fluid p-0">
    <div class="container position-relative p-0">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark p-3 py-lg-0">

            <a href="{% url 'restaurant:index' %}" class="navbar-brand p-0">
                <h1 class="text-primary m-0">
                    <i class="fa fa-utensils me-3"></i>AMBAVI
                </h1>
                <small class="text-light">Georgia on every plate.</small>
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto py-0 pe-4">
                    <a href="{% url 'restaurant:index' %}" class="nav-item nav-link active">Home</a>
                    <a href="{% url 'restaurant:about' %}" class="nav-item nav-link">About</a>
                    <a href="{% url 'restaurant:menu' %}" class="nav-item nav-link">Menu</a>
                    <a href="{% url 'restaurant:contact' %}" class="nav-item nav-link">Contact</a>
                    {% if user.is_authenticated %}
                        <form method="POST" action="{% url 'user:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="nav-item nav-link btn btn-link text-white text-decoration-none border-0">Log out</button>
                        </form>
                    {% else %}
                        <a href="{% url 'user:login' %}" class="nav-item nav-link">Log In</a>
                        <a href="{% url 'user:register' %}" class="nav-item nav-link">Register</a>
                    {% endif %}
                </div>

                <a href="{% url 'restaurant:cart' %}" class="btn btn-primary py-2 px-4">
                    <i class="fa fa-shopping-cart me-2"></i>Cart
                </a>
            </div>

        </nav>
    </div>

   
</div>
<!-- Navbar End -->
